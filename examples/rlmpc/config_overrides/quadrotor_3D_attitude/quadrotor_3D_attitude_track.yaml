task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_3d_delay
  quad_type: 9
  normalized_rl_action_space: False

  init_state:
    init_x: 0.0
    init_x_dot: 0
    init_y: 0.0
    init_y_dot: 0
    init_z: 1.0
    init_z_dot: 0
    init_tau: 0.36
  randomized_init: False
  randomized_inertial_prop: False
  # obstacle course should be within
  # x: [-3, 3]
  # y: [-2, 2]
  # z: [0, 2.5]

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 2
    trajectory_plane: 'xy'
    trajectory_position_offset: [0.0, 0.0, 1.0]
    trajectory_scale: 1.0
    # custom_snap_ref_traj: "/home/zoujoey/LSY_Projects/safe_control_gym/safe-control-gym/benchmarking_sim/quadrotor/data/custom_snap_ref_traj_1_pid_fast.npy"
    # custom_snap_ref_traj:

  inertial_prop:
    M: 0.037

  episode_len_sec: 11
  cost: rl_reward
  obs_goal_horizon: 1

  # RL Reward
  rew_state_weight: [ 5., 0.1, 5., 0.1, 5., 0.1, 0.1, 0.1, 0.1, 0.001, 0.001, 0.001, 0.001 ]
  rew_act_weight: [ 0.5, 0.5, 0.5, 0.5 ]
  rew_exponential: True

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input

  done_on_out_of_bound: True
  done_on_violation: False