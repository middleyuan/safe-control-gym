algo_config:
  # model args
  hidden_dim: 128
  activation: "relu"

  # actor args
  actor_config:
    q_mpc: [20., 0.1, 20., 0.1, 0.1, 0.01]
    r_mpc: [0.1, 0.1]
    qt_mpc: [20., 0.1, 20., 0.1, 0.1, 0.01]
    # model_param: [0.8, 0.8, 1., 0.8, 0.8, 0.8]
    # model_param: [0.6, 0.5, 1., 0.5, 0.5, 0.3]
    model_param: [1., 1., 1., 1., 1.]
    mpc_config:
      horizon: 20
      warmstart: True
      n_parallel_solver: 5
      n_train_solver: 32

  # loss args
  gamma: 0.98
  use_gae: True
  gae_lambda: 0.92
  use_clipped_value: False  # or True
  clip_param: 0.2
  target_kl: 0.01
  entropy_coef: 0.002
  exploration_init: -2.0

  # optim args
  opt_epochs: 20
  mini_batch_size: 256
  actor_lr: 0.003
  critic_lr: 0.001

  # runner args
  max_env_steps: 66000
  rollout_batch_size: 5
  rollout_steps: 660
  eval_batch_size: 5

  # misc
  log_interval: 3300
  save_interval: 540000
  num_checkpoints: 0
  eval_interval: 3300
  eval_save_best: True
  tensorboard: False
