algo_config:
  # model args
  hidden_dim: 256
  activation: "relu"

  # loss args
  gamma: 0.99
  use_gae: True
  gae_lambda: 0.95
  clip_param: 0.1
  target_kl: 0.005
  entropy_coef: 0.01  # 0.008
  exploration_init: -0.5

  # optim args
  opt_epochs: 3
  mini_batch_size: 256
  actor_lr: 0.0003
  critic_lr: 0.0003

  # runner args
  max_env_steps: 3300000
  rollout_batch_size: 100
  rollout_steps: 330
  eval_batch_size: 20

  # misc
  log_interval: 66000
  save_interval: 3300000
  num_checkpoints: 0
  eval_interval: 66000
  eval_save_best: True
  tensorboard: True
