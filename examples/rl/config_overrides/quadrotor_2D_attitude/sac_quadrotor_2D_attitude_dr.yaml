algo_config:
  # model args
  hidden_dim: 256
  activation: "relu"
  use_entropy_tuning: True

  # optim args
  gamma: 0.9
  train_interval: 3000
  train_batch_size: 512
  actor_lr: 0.0001
  critic_lr: 0.0001
  entropy_lr: 0.0001

  # runner args
  max_env_steps: 3300000
  warm_up_steps: 10000
  rollout_batch_size: 100
  num_workers: 1
  max_buffer_size: 330000
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 66000
  save_interval: 3300000
  num_checkpoints: 0
  eval_interval: 66000
  eval_save_best: True
  tensorboard: True
