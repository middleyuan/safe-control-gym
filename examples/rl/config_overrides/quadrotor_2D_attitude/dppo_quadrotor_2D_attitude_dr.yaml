algo_config:
  # model args
  hidden_dim: 256
  activation: "relu"

  # loss args
  gamma: 0.95
  use_gae: True
  gae_lambda: 0.9
  sr_lambda: 0.95
  clip_param: 0.1
  target_kl: 0.005
  entropy_coef: 0.01
  exploration_init: -0.5
  quantile_count: 200
  value_loss: 'sample_energy'
  value_loss_kwargs: {'sample_count': 200}
  risk_measure: 'wang'
  risk_measure_config: {'beta': 2.0}

  # optim args
  opt_epochs: 10
  mini_batch_size: 512
  actor_lr: 0.0001
  critic_lr: 0.0001

  # runner args
  max_env_steps: 5280000 # 5280000
  rollout_batch_size: 80
  rollout_steps: 330
  eval_batch_size: 20

  # misc
  log_interval: 52800   # 26400
  save_interval: 5280000   # 5280000
  num_checkpoints: 0
  eval_interval: 52800   # 26400
  eval_save_best: True
  tensorboard: True
