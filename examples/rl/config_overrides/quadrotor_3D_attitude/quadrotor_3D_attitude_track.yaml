task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_3d
  # physics: pyb
  quad_type: 6
  normalized_rl_action_space: False

  init_state:
    init_x: 0
    init_x_dot: 0
    init_z: 1.0
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0

  randomized_init: True
  randomized_inertial_prop: False

  init_state_randomization_info:
    init_x:
      distrib: 'uniform'
      low: -0.005
      high: 0.005
    init_x_dot:
      distrib: 'uniform'
      low: -0.005
      high: 0.005
    init_z:
      distrib: 'uniform'
      low: -0.005
      high: 0.005
    init_z_dot:
      distrib: 'uniform'
      low: -0.005
      high: 0.005
    init_theta:
      distrib: 'uniform'
      low: -0.005
      high: 0.005
    init_theta_dot:
      distrib: 'uniform'
      low: -0.005
      high: 0.005

