  task: traj_tracking
  task_info:
    trajectory_type: snap_custom
    num_cycles: 2
    trajectory_plane: 'xy'
    trajectory_position_offset: [ 0., 1.]
    trajectory_scale: 1.
    strings:
      - start: [1., 0.0, -0.1]
        end: [1., 0.0, 5.]
      - start: [3.0, 1.0, -0.1]
        end: [3.0, 1.0, 5.]
      - start: [3.0, -0.5, -0.1]
        end: [3.0, -0.5, 5.]
    waypoints:
      - time: 0
        position: [0.0, 0.0, 1.0]
      - time: 6
        position: [3.0, 0.0, 1.0]
      - time: 11
        position: [5.0, 0.0, 1.0]

  episode_len_sec: 11
  cost: rl_reward
  obs_goal_horizon: 1

  rew_state_weight: [3.0, 0.1, 3.0, 0.1, 3.0, 0.1, 0.1, 0.1, 0.1, 0.001, 0.001, 0.001]
  rew_act_weight: [0.1, 0.1, 0.1, 0.1]
  rew_exponential: True

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input

  done_on_out_of_bound: True
  done_on_violation: False
