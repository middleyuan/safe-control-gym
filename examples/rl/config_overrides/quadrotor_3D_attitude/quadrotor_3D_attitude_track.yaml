task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_3d_delay
  quad_type: 9
  normalized_rl_action_space: False

  init_state:
    init_x: 0.0
    init_x_dot: 0
    init_y: 0.0
    init_y_dot: 0
    init_z: 1
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0
    init_tau: 0.3626

  randomized_init: True
  randomized_inertial_prop: False

  init_state_randomization_info:
    init_x:
      distrib: 'normal'
      scale: 0.0011629923113331312
    init_x_dot:
      distrib: 'normal'
      scale: 0.003635597781389117
    init_y:
      distrib: 'normal'
      scale: 0.001670549279531124
    init_y_dot:
      distrib: 'normal'
      scale: 0.004965500657569368
    init_z:
      distrib: 'normal'
      scale: 0.0024990695232428458
    init_z_dot:
      distrib: 'normal'
      scale: 0.010193088084183025
    init_phi:
      distrib: 'normal'
      scale: 0.0026984744060397532
    init_theta:
      distrib: 'normal'
      scale: 0.0024088251667187467
    init_psi:
      distrib: 'normal'
      scale: 0.0023822834889102923
    init_p:
      distrib: 'normal'
      scale: 0.03452115832640752
    init_q:
      distrib: 'normal'
      scale: 0.02387283406599296
    init_r:
      distrib: 'normal'
      scale: 0.03123258323211547

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 2
    trajectory_plane: 'xy'
    trajectory_position_offset: [0, 0, 1]
    trajectory_scale: 1.0

  inertial_prop:
    M: 0.037

  episode_len_sec: 11
  cost: rl_reward
  obs_goal_horizon: 1
  rew_exponential: True

  rew_state_weight: [20.0, 0.1, 20.0, 0.1, 20.0, 0.1, 0.1, 0.1, 0.1, 0.001, 0.001, 0.001, 0.001]
  rew_act_weight: [0.1, 0.1, 0.1, 0.1] #set to 1 if action noise is too large

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input

  done_on_out_of_bound: True
  done_on_violation: False
  disturbances:
    action:
      - disturbance_func: white_noise
        # std: [0.03116, 0.03450]
        std: [0.021, 0.078, 0.071, 0.064]
        # std: [0.063, 0.234, 0.213, 0.192]  # 3 times
        # std: [0.1558, 0.1725]  # 5 times
        # std: [0.21812, 0.2415]  # 7 times
        # std: [0.3116, 0.345]  # 10 times
