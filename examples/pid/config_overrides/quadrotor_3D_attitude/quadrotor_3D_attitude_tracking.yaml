task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_3d
  quad_type: 6
  # quad_type: 9
  # normalized_rl_action_space: False
  init_state:
    init_x: 1
    init_x_dot: 0
    init_z: 1.5
    init_z_dot: 0
  # obstacle course should be within
  # x: [-3, 3]
  # y: [-2, 2]
  # z: [0, 2.5]
  task: traj_tracking
  task_info:
    trajectory_type: snap_custom
    num_cycles: 2
    trajectory_plane: 'xy'
    trajectory_position_offset: [ 0., 0.]
    trajectory_scale: 1.
    strings:
      - start: [1.0, 1.75, 0.75]
        end: [1.0, 1.25, 0.75]
      - start: [0.0, 1.75, 0.75]
        end: [0.0, 1.25, 0.75]
      - start: [-1.0, 1.75, 0.75]
        end: [-1.0, 1.25, 0.75]
      - start: [-1.25, 1.25, 1.00]
        end: [-1.25, 1.25, 0.5]
      # - start: [1.0, 1.5, 1.00]
      #   end: [1.0, 1.5, 0.5]
      # - start: [0.0, 1.5, 1.00]
      #   end: [0.0, 1.5, 0.5]
      # - start: [-1.0, 1.5, 1.00]
      #   end: [-1.0, 1.5, 0.5]
      # - start: [-1.25, 1.25, 1.00]
      #   end: [-1.25, 1.25, 0.5]
    waypoints:
      - time: 2
        position: [0.0, 0.00, 1.00]
      - time: 6
        position: [0.75, -1.0, 0.75]
      - time: 10
        position: [1.5, 1.5, 0.75]
      - time: 14
        position: [0.5, 1.5, 0.75]
      - time: 18
        position: [-0.5, 1.5, 0.75]
      - time: 22
        position: [-1.5, 1.5, 0.75]
      - time: 26
        position: [-1.0, 1.0, 0.75]
      - time: 30
        position: [-1.5, 1.5, 0.75]
      - time: 34
        position: [-1.25, -1.5, 1.00]
      - time: 38
        position: [0.0, 0.0, 1.0]
  inertial_prop:
    M: 0.033
  episode_len_sec: 40
  # cost: rl_reward
  cost: quadratic
  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input
  done_on_violation: False