task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_3d_delay
  quad_type: 9
  # normalized_rl_action_space: False
  init_state:
    # init_x: 2.50
    # init_x_dot: 0
    # init_y: 1.35
    # init_y_dot: 0
    # init_z: 1.2
    # init_z_dot: 0
  # init_state:
    init_x: 1.3
    init_x_dot: 0
    init_y: 0.5
    init_y_dot: 0
    init_z: 1.1
    init_z_dot: 0
  # obstacle course should be within
  # x: [-3, 3]
  # y: [-2, 2]
  # z: [0, 2.5]
  task: traj_tracking
  task_info:
    trajectory_type: snap_custom
    num_cycles: 1
    trajectory_plane: 'xy'
    trajectory_position_offset: [0, 0, 0]
    trajectory_scale: 1.0
    # custom_snap_ref_traj: "/home/benchmark/safe-control-gym/benchmarking_sim/quadrotor/data/custom_snap_ref_traj.npy"
    # custom_snap_ref_traj: "/home/benchmark/safe-control-gym/benchmarking_sim/quadrotor/data/custom_snap_ref_traj_final_0_vf_ss.npy"
    use_ilqr_ref: True
  # task_info:
  #   trajectory_type: figure8
  #   num_cycles: 2
  #   trajectory_plane: 'xy'
  #   trajectory_position_offset: [2.0, -0.5, 1]
  #   trajectory_scale: 1.0
  inertial_prop:
    M: 0.037
  # episode_len_sec: 23.24
  # episode_len_sec: 29.05
  # episode_len_sec: 43.575
  episode_len_sec: 12.5
  # episode_len_sec: 15.5
  # episode_len_sec: 20.5
  # episode_len_sec: 7

  # cost: rl_reward    
  cost: quadratic
  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input
  done_on_violation: False