task_config:
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_3d

  quad_type: 6
  normalized_rl_action_space: False

  init_state:
    init_x: 0
    init_x_dot: 0
    init_z: 1.0
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0

  randomized_init: True
  randomized_inertial_prop: False

  init_state_randomization_info:
    init_x:
      distrib: 'uniform'
      low: -0.05
      high: 0.05
    init_x_dot:
      distrib: 'uniform'
      low: -0.05
      high: 0.05
    init_z:
      distrib: 'uniform'
      low: -0.05
      high: 0.05
    init_z_dot:
      distrib: 'uniform'
      low: -0.05
      high: 0.05
    init_theta:
      distrib: 'uniform'
      low: -0.05
      high: 0.05
    init_theta_dot:
      distrib: 'uniform'
      low: -0.05
      high: 0.05

  # task: traj_tracking
  # task_info:
  #   trajectory_type: snap_custom
  #   num_cycles: 2
  #   trajectory_plane: 'xz'
  #   trajectory_position_offset: [ 0., 1.]
  #   trajectory_scale: 1.
  #   strings:
  #     - start: [1., -1.1, 1.]
  #       end: [1., 1.2, 1.]
  #     - start: [3., -1.1, 2.]
  #       end: [3., 1.2, 2.]
  #   waypoints:
  #     - time: 0
  #       position: [0.0, 0.0, 1.0]
  #     - time: 4
  #       position: [1.0, 0.0, 1.0]
  #     - time: 9
  #       position: [2.5, 0.0, 1.0]

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 2
    trajectory_plane: 'xy'
    trajectory_position_offset: [0, 0, 1]
    trajectory_scale: 1.0

  episode_len_sec: 26
  cost: quadratic

  rew_state_weight: [10.0, 0.1, 10.0, 0.1, 10.0, 0.1, 0.1, 0.001, 0.1, 0.001, 0.1, 0.001]
  rew_act_weight: [0.1, 0.1, 0.1, 0.1]

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input

  done_on_out_of_bound: True
  done_on_violation: False
  disturbances:
    dynamics:
      - disturbance_func: white_noise
        std: 0.005
    observation:
      - disturbance_func: white_noise
        std: [0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005]
    action:
      - disturbance_func: impulse
        magnitude: 0.01
        step_offset: 2
        duration: 1
        decary_rate: 1
