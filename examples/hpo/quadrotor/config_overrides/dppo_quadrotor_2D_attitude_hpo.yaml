hpo_config:

  load_if_exists: True # this should set to True if hpo is run in parallel
  objective: [exponentiated_rmse, exponentiated_rms_action_change] # [other metrics defined in base_experiment.py]
  objective_bounds: [[0.0, 1.0], [0.0, 1.0]] # [bounds for each objective]. Worse value will be assigned if objective evaluation is None
  direction: [maximize, maximize] # [minimize, maximize]
  repetitions: 5 # number of samples of performance for each objective query
  n_episodes: 5 # number of episodes to evaluate each policy
  use_gpu: True
  seed: 24
  save_n_best_hps: 1

  # Budget
  trials: 50
  hp_eval_list: ['hps_config']

  # hyperparameters
  hps_config:
    # model args
    hidden_dim: 256
    activation: "relu"

    # loss args
    gamma: 0.98
    use_gae: True
    gae_lambda: 0.95
    clip_param: 0.2
    target_kl: 0.01
    entropy_coef: 0.01
    quantile_count: 200
    value_loss: 'sample_energy'
    risk_measure: 'wang'
    beta: 0.2

    # optim args
    opt_epochs: 20
    mini_batch_size: 256
    actor_lr: 0.001
    critic_lr: 0.001

    # runner args
    max_env_steps: 1584000
    rollout_batch_size: 10
    rollout_steps: 330
    eval_batch_size: 10

    # misc
    log_interval: 13200
    save_interval: 1584000
    num_checkpoints: 0
    eval_interval: 13200
    eval_save_best: True
    tensorboard: True

    # objective
    rew_state_weight: [5., .1, 5., .1, .1, 0.001]
    rew_act_weight: [.1, .1]

  dr_init:
    # model args
    hidden_dim: 256
    activation: "relu"

    # loss args
    gamma: 0.9
    use_gae: True
    gae_lambda: 0.9
    clip_param: 0.1
    target_kl: 0.001
    entropy_coef: 0.01
    quantile_count: 200
    value_loss: 'sample_energy'
    risk_measure: 'wang'
    beta: -1.0

    # optim args
    opt_epochs: 5
    mini_batch_size: 512
    actor_lr: 0.0001
    critic_lr: 0.0001

    # runner args
    max_env_steps: 3300000
    rollout_batch_size: 100
    rollout_steps: 330
    eval_batch_size: 20

    # misc
    log_interval: 66000
    save_interval: 3300000
    num_checkpoints: 0
    eval_interval: 66000
    eval_save_best: True
    tensorboard: True
