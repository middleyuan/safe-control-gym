hpo_config:

  load_if_exists: True # this should set to True if hpo is run in parallel
  objective: [exponentiated_rmse, exponentiated_rms_action_change] # [other metrics defined in base_experiment.py]
  objective_bounds: [[0.0, 1.0], [0.0, 1.0]] # [bounds for each objective]. Worse value will be assigned if objective evaluation is None
  direction: [maximize, maximize] # [minimize, maximize]
  repetitions: 2 # number of samples of performance for each objective query
  n_episodes: 5 # number of episodes to evaluate each policy
  use_gpu: True
  seed: 24
  save_n_best_hps: 1
  # budget
  trials: 50
  hp_eval_list: ['hps_config']

  # hyperparameters
  hps_config:
    # model args
    hidden_dim: 256
    activation: "relu"
    use_entropy_tuning: True

    # optim args
    gamma: 0.98
    train_interval: 200
    train_batch_size: 256
    actor_lr: 0.001
    critic_lr: 0.001
    entropy_lr: 0.001

    # runner args
    max_env_steps: 1584000
    warm_up_steps: 1000
    rollout_batch_size: 10
    num_workers: 1
    max_buffer_size: 132000
    deque_size: 10
    eval_batch_size: 10

    # misc
    log_interval: 13200
    save_interval: 1584000
    num_checkpoints: 0
    eval_interval: 13200
    eval_save_best: True
    tensorboard: True
    
  # init HPs
  basic_init:
    # model args
    hidden_dim: 256
    activation: "relu"
    use_entropy_tuning: True

    # optim args
    gamma: 0.98
    train_interval: 200
    train_batch_size: 256
    actor_lr: 0.001
    critic_lr: 0.001
    entropy_lr: 0.001

    # runner args
    max_env_steps: 1584000
    warm_up_steps: 1000
    rollout_batch_size: 10
    num_workers: 1
    max_buffer_size: 132000
    deque_size: 10
    eval_batch_size: 10

    # misc
    log_interval: 13200
    save_interval: 1584000
    num_checkpoints: 0
    eval_interval: 13200
    eval_save_best: True
    tensorboard: True

    # objective
    rew_state_weight: [5., .1, 5., .1, .1, 0.001]
    rew_act_weight: [.1, .1]

  dr_init:
    # model args
    hidden_dim: 256
    activation: "relu"
    use_entropy_tuning: True

    # optim args
    gamma: 0.9
    train_interval: 3000
    train_batch_size: 512
    actor_lr: 0.0001
    critic_lr: 0.0001
    entropy_lr: 0.0001

    # runner args
    max_env_steps: 3300000
    warm_up_steps: 10000
    rollout_batch_size: 100
    num_workers: 1
    max_buffer_size: 330000
    deque_size: 10
    eval_batch_size: 10

    # misc
    log_interval: 66000
    save_interval: 3300000
    num_checkpoints: 0
    eval_interval: 66000
    eval_save_best: True
    tensorboard: True
  
    # objective
    rew_state_weight: [1.,.1,1.,.1,.1,0.001]
    rew_act_weight: [.1, .1]


