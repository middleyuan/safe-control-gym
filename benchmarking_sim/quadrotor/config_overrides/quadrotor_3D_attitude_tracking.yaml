task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60

  # physics: dyn_si_3d
  # quad_type: 6
  physics: dyn_si_3d_delay
  quad_type: 9

  init_state:
    init_x: 0
    init_x_dot: 0
    init_z: 1.0
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0
    init_tau: 0.3234
    # init_psi: 1.0
  # randomized_init: True
  randomized_init: False
  randomized_inertial_prop: False


# yaw: std: 0.0023822834889102923
# yaw_rate: std: 0.03123258323211547

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 2
    trajectory_plane: 'xy'
    trajectory_position_offset: [0, 0., 1]
    trajectory_scale: 1.0
    # ilqr_ref: True
    # ilqr_traj_data: /home/mingxuan/Repositories/scg_tsung/examples/lqr/ilqr_ref_traj.npy

  inertial_prop:
    M: 0.033
  #   Iyy: 1.4e-05
  #   beta_1: 18.11
  #   beta_2: 3.68
  #   beta_3: 0.0
  #   alpha_1: -140.8
  #   alpha_2: -13.4
  #   alpha_3: 124.8
  #   pitch_bias: 0.0 # in radian

  episode_len_sec: 11
  cost: quadratic

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input

  done_on_out_of_bound: True
  done_on_violation: False
