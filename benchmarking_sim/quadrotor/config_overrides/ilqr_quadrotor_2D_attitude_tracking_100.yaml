algo: ilqr
algo_config:
  # Cost parameters
  q_lqr:
  - 11.902573972698155
  - 0.0001
  - 20.0
  - 20.0
  - 0.0001
  - 0.0001
  r_lqr:
  - 5.0
  - 0.6266401395970063

  # Model arguments
  # Note: Higher simulation frequency is required if using controller designed
  #       based on the continuous-time model
  discrete_dynamics: True

  # iLQR arguments
  epsilon: 0.01
  lamb_factor: 25
  lamb_max: 3000
  max_iterations: 20
  warm_start_traj: ./data/mpc_acados_quadrotor_2D_attitude_11_warmstart_traj.npy
  # the actual warm start trajectory file name will be modified in the controller
  # to match the current episode length

  output_dir: ./ilqr/results
