task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si
  quad_type: 4

  init_state:
    init_x: 0
    init_x_dot: 0
    init_z: 1.0
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0
  randomized_init: True
  randomized_inertial_prop: False

  inertial_prop_randomization_info:
    beta_1: # Nominal: 17.7906
      distrib: 'normal'
      scale: 0.23
    beta_2: # Nominal: 4.2207
      distrib: 'normal'
      scale: 0.07
    alpha_1:  # Nominal: -147.278425
      distrib: 'normal'
      scale: 4.291350
    alpha_2: # Nominal: -16.394987
      distrib: 'normal'
      scale: 0.426656
    alpha_3:  # Nominal: 126.953135
      distrib: 'normal'
      scale: 5.728551

  init_state_randomization_info:
    init_x:
      distrib: 'normal'
      scale: 0.0011629923113331312
    init_x_dot:
      distrib: 'normal'
      scale: 0.003635597781389117
    init_z:
      distrib: 'normal'
      scale: 0.0024990695232428458
    init_z_dot:
      distrib: 'normal'
      scale: 0.010193088084183025
    init_theta:
      distrib: 'normal'
      scale: 0.0024088251667187467
    init_theta_dot:
      distrib: 'normal'
      scale: 0.02387283406599296

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 2
    trajectory_plane: 'xz'
    trajectory_position_offset: [0, 1.]
    trajectory_scale: 1.0
    ilqr_ref: True

  episode_len_sec: 11
  cost: quadratic

  rew_state_weight: [12, 0.1, 12, 0.1, 0.05, 0.0001]
  rew_act_weight: [3, 3]

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
      upper_bounds: [ 0.9,  2, 1.45,  2,  0.75,  3]
      lower_bounds: [-0.9, -2, 0.55, -2, -0.75, -3]
    - constraint_form: default_constraint
      constrained_variable: input

  done_on_out_of_bound: True
  done_on_violation: False
