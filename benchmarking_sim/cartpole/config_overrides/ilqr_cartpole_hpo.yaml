hpo_config:
  hpo: True # Do hyperparameter optimization
  load_if_exists: True # Should set to True if hpo is run in parallel
  use_database: True # Should set to True if MySQL is used
  objective: [average_rmse] # Other metrics defined in base_experiment.py
  direction: [minimize] # Minimize or maximize
  dynamical_runs: False # If True, dynamically increase runs
  warm_trials: 20 # Number of trials to run before dyamical runs
  approximation_threshold: 5 # Only used when dynamical_runs is True
  repetitions: 5 # Number of samples of performance for each objective query
  alpha: 1 # Significance level for CVaR
  use_gpu: True
  dashboard: False
  seed: 24
  save_n_best_hps: 3

  # Budget
  trials: 40

  # Hyperparameters
  hps_config:
    max_iterations: 15
    lamb_factor: 10
    lamb_max: 1000
    epsilon: 0.01
    state_weight: 1
    state_dot_weight: 0.1
    action_weight: 0.1
