# Model args
hidden_dim: 64
activation: 'tanh'
norm_obs: False
norm_reward: False
clip_obs: 10
clip_reward: 10

# actor config
actor_config:
  q_mpc: [ 1.0 ]
  r_mpc: [ 1.0 ]
  # qt_mpc: [ 1.0 ]
  model_param: [1., 1., 1., 1., 1.]
  mpc_config:
    horizon: 20
    warmstart: True
    n_parallel_solver: 1
    n_train_solver: 1

# Loss args
gamma: 0.99
use_gae: False
gae_lambda: 0.95
use_clipped_value: False
clip_param: 0.2
target_kl: 0.01
entropy_coef: 0.01
exploration_init: -1.0

# Optim args
opt_epochs: 10
mini_batch_size: 64
actor_lr: 0.001
critic_lr: 0.001
max_grad_norm: 0.5

# Runner args
max_env_steps: 1000000
num_workers: 1
rollout_batch_size: 4
rollout_steps: 100
deque_size: 10
eval_batch_size: 10

# Misc
log_interval: 0
save_interval: 0
num_checkpoints: 0
eval_interval: 0
eval_save_best: False
tensorboard: False
